spring.application.name=SignatureNumeriqueBackend

# =========================
# DATABASE (POSTGRESQL)
# =========================
spring.datasource.url=jdbc:postgresql://localhost:5432/signature_db
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================
# JPA / HIBERNATE
# =========================
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.open-in-view=false

spring.session.jdbc.initialize-schema=always

# =========================
# MONGODB (AUDIT)
# =========================
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI}

# =========================
# FILE UPLOAD
# =========================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# =========================
# SECURITY BASIC
# =========================
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.security.user.name=none
spring.security.user.password=none

# =========================
# MAIL (BREVO SMTP)
# =========================
spring.mail.host=smtp-relay.brevo.com
spring.mail.port=2525
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.enable=false

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.debug=true

# =========================
# GOOGLE OAUTH2
# =========================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI}

google.client.id=${GOOGLE_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET}

# =========================
# TSA (TIMESTAMP)
# =========================
tsa.url=https://freetsa.org/tsr
tsa.enabled=true
tsa.hash-algorithm=SHA256
tsa.certificate.path=classpath:tsa.crt
tsa.ca-certificate.path=classpath:cacert.pem

# =========================
# PKI
# =========================
pki.certificat.duree.minutes=365
pki.stockage.chemin=./coffre-pki

# =========================
# HSM
# =========================
hsm.pin=${HSM_PIN}
hsm.pin.utilisateur=${HSM_USER_PIN}
hsm.config=src/main/resources/softhsm2.cfg

# =========================
# SUPER ADMIN
# =========================
app.superadmin.email=${SUPERADMIN_EMAIL}
app.superadmin.password=${SUPERADMIN_PASSWORD}
app.superadmin.nom=${SUPERADMIN_NOM}
app.superadmin.prenom=${SUPERADMIN_PRENOM}
app.superadmin.telephone=${SUPERADMIN_PHONE}

# =========================
# SERVER
# =========================
server.port=${PORT:8080}
server.ssl.enabled=false

# =========================
# THYMELEAF
# =========================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# =========================
# PERFORMANCE / DEBUG
# =========================
spring.main.allow-bean-definition-overriding=true
spring.mvc.async.request-timeout=30000

spring.main.arguments=--java.net.preferIPv4Stack=true

logging.level.org.apache.catalina=DEBUG
logging.level.org.springframework.boot.web.embedded.tomcat=DEBUG

# =========================
# ARCHIVE
# =========================
archivage.dossier.base=/data/archives
archivage.duree.conservation.ans=10
archivage.format.pdfa=true
archivage.compression=true

# =========================
# LIMITS
# =========================
app.signature.limite-quotidienne=2
app.signature.limite-hebdomadaire=100
app.signature.limite-mensuelle=300